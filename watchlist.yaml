# Settings only. Your actual alerts are created from Telegram (/add) and
# stored in watches.json — you don't need to edit this file to add movies.
# You can still hand-write watches here if you prefer; both are merged.

defaults:
  city: hyderabad          # only a fallback; the bot sets this per person
  region_code: HYD
  poll_seconds: 60
  jitter_seconds: 10
  heartbeat_minutes: 0
  engine: auto

telegram:
  bot_token: ${TELEGRAM_BOT_TOKEN}
  chat_id: ${TELEGRAM_CHAT_ID}
  repeat_count: 3
  repeat_every_seconds: 1800

desktop:
  enabled: true
  sound: Sosumi

watches: []
