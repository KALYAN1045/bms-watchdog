# Free scheduled checks on GitHub's runners.
#
# The real limit here is timing, not access: GitHub's cron has a 5-minute
# floor and is frequently 5–20 minutes late, so this will not win you a
# first-day-first-show scramble. Fine as a backstop.
#
# Cloudflare may also rate a datacenter IP badly regardless of TLS fingerprint.
# Run the workflow manually once (workflow_dispatch) to find out.
#
# MINUTES: public repos get unlimited Actions minutes, so */5 is free there.
# A PRIVATE repo only gets 2,000 minutes/month on the Free plan, and every run
# bills a minimum of one minute -- */5 would need ~8,600. In a private repo use
# "*/30 * * * *" (~1,440/month) or make the repo public. Nothing secret lives
# in it: the bot token is a GitHub Actions secret, not a file.
#
# GitHub also disables scheduled workflows in repos with no commits for 60
# days. It emails you first; a single commit re-enables them.
#
# The Telegram bot works here too, but only as fast as this schedule: a button
# press is answered on the next run, so up to 5-20 minutes later. For a bot
# that replies instantly you need a long-running process -- `watch.py bot` on
# a VM (see the README).
#
# Practical hybrid: create your alerts with the bot running locally (instant),
# commit watches.json, and let this workflow do the 24/7 watching.
#
# A burst of pings is delivered inside a single run, so alerts still arrive as
# bursts; only the long gap between bursts spans runs.
name: watch

on:
  # Schedule disabled. Two independent reasons, both observed on this repo:
  #
  #  1. Cloudflare refuses GitHub's runner IPs *intermittently* -- of the first
  #     four runs, two reached BookMyShow and two were blocked. A watchdog that
  #     works half the time is not a watchdog.
  #  2. GitHub drops scheduled runs on low-activity repos. A "*/5" cron
  #     produced 4 runs in 9 hours, not the ~108 it implies.
  #
  # Re-enable by uncommenting, but prefer a machine on a residential IP.
  # schedule:
  #   - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: bms-watch
  cancel-in-progress: false

permissions:
  contents: write          # to commit state.json so alerts don't repeat

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15        # a run may spend ~2 min finishing an alert burst
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run one check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BMS_DESKTOP: "0"
        run: python watch.py check

      - name: Persist alert state and any watches added from Telegram
        run: |
          if [[ -n "$(git status --porcelain state.json watches.json)" ]]; then
            git config user.name  "bms-watchdog"
            git config user.email "bot@users.noreply.github.com"
            git add state.json watches.json
            git commit -m "state: record alerts and watches [skip ci]"
            # another run may have pushed while this one was checking
            git push || { git pull --rebase --autostash -q && git push; }
          fi
