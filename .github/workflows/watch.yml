# Free scheduled checks on GitHub's runners.
#
# HONEST WARNING: this is best-effort. BookMyShow is behind Cloudflare, which
# blocks datacenter IPs — GitHub's runners are datacenter IPs. Expect this to
# work sometimes and 403 other times. The reliable setup is running it on your
# own machine (see scripts/install-launchd.sh) or a self-hosted runner at home.
#
# Also note: GitHub's cron has a 5-minute floor and is frequently 5–20 minutes
# late. It will not give you first-minute alerts for a big release.
name: watch

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: bms-watch
  cancel-in-progress: false

permissions:
  contents: write          # to commit state.json so alerts don't repeat

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Install Chromium + Xvfb
        run: |
          python -m playwright install --with-deps chromium
          sudo apt-get install -y xvfb

      - name: Run one check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BMS_CHANNEL: chromium      # no Google Chrome on the runner
          BMS_WINDOW: visible        # nothing to minimise under Xvfb
          BMS_DESKTOP: "0"
        run: xvfb-run --auto-servernum python watch.py check

      - name: Remember what we already alerted on
        run: |
          if [[ -n "$(git status --porcelain state.json)" ]]; then
            git config user.name  "bms-watchdog"
            git config user.email "bot@users.noreply.github.com"
            git add state.json
            git commit -m "state: record alerts [skip ci]"
            git push
          fi
